[project]
name = "travel-agent-backend"
version = "0.1.0"
description = "AI Travel Agent FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
